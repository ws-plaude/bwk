[package]
name = "bwk-coldcard"
version = "0.13.0"
description = "Coldcard wallet interface, vendored from the coldcard crate and ported to libsecp256k1"
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
keywords.workspace = true

[features]
default = ["linux-static-hidraw"]
linux-static-hidraw = ["hidapi/linux-static-hidraw"]
linux-static-libusb = ["hidapi/linux-static-libusb"]
log = ["dep:log"]

[dependencies]
aes = "0.8.3"
base58 = "0.2.0"
bitcoin = { workspace = true }
ctr = "0.9.2"
hidapi = { version = "2.5.1", default-features = false }
log = { version = "0.4.20", optional = true }
secp256k1 = { workspace = true, features = ["rand-std", "std"] }
