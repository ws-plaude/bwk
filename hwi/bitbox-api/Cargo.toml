[package]
name = "bitbox-api"
version = "0.9.0"
edition = "2021"
description = "Fork of bitbox-api (https://github.com/BitBoxSwiss/bitbox-api-rs) with async removed"

[lib]
name = "bitbox_api"
path = "src/lib.rs"

[features]
usb = ["dep:hidapi"]

[dependencies]
base32 = "0.4"
bitcoin = { version = "0.32", features = ["base64"] }
byteorder = "1.3.2"
getrandom = "0.2"
hex = "0.4"
hidapi = { version = "2.3", optional = true }
noise-protocol = "0.2"
noise-rust-crypto = "0.6"
semver = "1.0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bwk-error.workspace = true
zeroize = "1"

# Local timezone offset for the device clock, see util::local_utc_offset_secs.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_SystemServices", "Win32_System_Time"] }
