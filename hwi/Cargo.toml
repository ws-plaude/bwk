[package]
name = "bwk-hwi"
version = "0.0.30"
readme = "README.md"
description = "Hardware wallet interface"
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
keywords.workspace = true

[features]
default = ["ledger", "specter", "coldcard", "bitbox", "jade", "ureq", "service"]
bitbox = ["hidapi", "bitbox-api", "regex"]
coldcard = ["dep:coldcard", "regex"]
specter = ["serialport"]
# The jade pin server needs an http client: pick minreq or ureq.
jade = ["serde", "serde_bytes", "cbor4ii", "serialport"]
minreq = ["dep:minreq"]
ureq = ["dep:ureq"]
ledger = ["regex", "ledger-bitcoin-client", "ledger-transport-hidapi", "hidapi"]
regex = ["dep:regex"]
service = ["bitbox", "coldcard", "jade", "ledger", "specter", "tracing", "hex", "crossbeam-channel"]

[dependencies]
bitcoin = { version = "0.32", default-features = false, features = ["base64", "serde", "std"] }

# specter & jade
serialport = { version = "4.3", optional = true }

# jade
serde = { version = "1.0", features = ["derive"], optional = true }
serde_bytes = { version = "0.11.14", optional = true }
cbor4ii = { version = "1", default-features = false, features = ["serde1", "use_alloc"], optional = true }
ureq = { workspace = true, features = ["json", "native-tls"], optional = true }
# native-tls to match ureq above and bwk-electrum, so a binary carries a single TLS stack.
minreq = { version = "3.0", default-features = false, features = ["https-native-tls", "json-using-serde"], optional = true }

# bitbox
bitbox-api = { path = "bitbox-api", default-features = false, features = ["usb"], optional = true }

# coldcard
coldcard = { package = "bwk-coldcard", path = "coldcard", optional = true }

# ledger
ledger-bitcoin-client = { path = "ledger-bitcoin-client", optional = true }
ledger-transport-hidapi = { path = "ledger-transport-hidapi", optional = true }

# bitbox & ledger
hidapi = { version = "2.5.1", features = ["linux-static-hidraw"], default-features = false, optional = true }
regex = { version = "1.6.0", optional = true }

# service module (requires all device features)
tracing = { version = "0.1.37", optional = true }
hex = { version = "0.4.3", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
